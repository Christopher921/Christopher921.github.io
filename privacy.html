<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Canadian Take-Home Pay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            line-height: 1.6;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px 20px;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            font-weight: 700;
            font-size: 21px;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 45px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
            line-height: 1.2;
        }

        h2 {
            margin-top: 34px;
            font-size: 21px;
        }

        p, li {
            color: #4b5563;
        }

        ul {
            padding-left: 25px;
        }

        .updated {
            color: #6b7280;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 35px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 30px 20px 50px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        Canadian Take-Home Pay
    </div>
</header>

<main>
    <section class="card">

        <h1>Privacy Policy</h1>

        <p class="updated">
            Effective date: October 3, 2026
        </p>

        <p>
            Canadian Take-Home Pay ("the App") respects your privacy.
            This Privacy Policy explains how information may be handled
            when you use the App.
